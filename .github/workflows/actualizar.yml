name: Actualizar publicaciones EPO

on:
  workflow_dispatch:

  schedule:
    # Miércoles a las 13:30 UTC.
    # España: 14:30 en invierno y 15:30 en verano.
    - cron: "30 13 * * 3"

permissions:
  contents: write

concurrency:
  group: actualizar-publicaciones-epo
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear RSS
        run: |
          python actualizar_rss.py

      - name: Comprobar RSS
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          archivo = Path("feed.xml")

          if not archivo.exists():
              raise SystemExit(
                  "ERROR: feed.xml no existe"
              )

          if archivo.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: feed.xml está vacío"
              )

          raiz = ET.parse(
              archivo
          ).getroot()

          entradas = raiz.findall(
              "./channel/item"
          )

          print("RSS XML correcto.")
          print(
              f"Tamaño: "
              f"{archivo.stat().st_size} bytes"
          )
          print(
              f"Entradas: {len(entradas)}"
          )

          if not entradas:
              raise SystemExit(
                  "ERROR: el RSS no tiene entradas"
              )

          print(
              "Primera entrada:"
          )
          print(
              entradas[0].findtext(
                  "title"
              )
          )
          PY

      - name: Guardar RSS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"

          git add feed.xml historial.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar publicaciones EPO"
            git push
          fi
