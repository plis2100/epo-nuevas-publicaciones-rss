name: Actualizar publicaciones EPO v2

on:
  workflow_dispatch:

  schedule:
    # Miércoles a las 14:05 UTC
    - cron: "5 14 * * 3"

permissions:
  contents: write

concurrency:
  group: actualizar-publicaciones-epo-v2
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear RSS nuevo
        run: |
          python actualizar_rss.py

      - name: Comprobar RSS nuevo
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          archivo = Path("epo-feed-v2.xml")

          if not archivo.exists():
              raise SystemExit(
                  "ERROR: epo-feed-v2.xml no existe"
              )

          if archivo.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: epo-feed-v2.xml está vacío"
              )

          raiz = ET.parse(archivo).getroot()

          entradas = raiz.findall(
              "./channel/item"
          )

          print("RSS XML correcto.")
          print(
              f"Tamaño: "
              f"{archivo.stat().st_size} bytes"
          )
          print(
              f"Entradas: {len(entradas)}"
          )

          if not entradas:
              raise SystemExit(
                  "ERROR: el RSS no tiene entradas"
              )

          titulos = [
              entrada.findtext("title", "")
              for entrada in entradas
          ]

          correctos = [
              titulo
              for titulo in titulos
              if (
                  "Solicitante no indicado"
                  not in titulo
                  and "Título no disponible"
                  not in titulo
              )
          ]

          print(
              f"Entradas con solicitante "
              f"y título: {len(correctos)}"
          )

          if not correctos:
              raise SystemExit(
                  "ERROR: ninguna entrada contiene "
                  "solicitante y título"
              )

          print("Primera entrada correcta:")
          print(correctos[0])
          PY

      - name: Guardar RSS nuevo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"

          git add epo-feed-v2.xml historial.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar publicaciones EPO v2"
            git push
          fi
